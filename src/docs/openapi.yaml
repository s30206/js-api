openapi: 3.0.3
info:
  title: PC Parts Store API
  version: 1.0.0
  description: |
    REST API for an online shop selling PC components.

    Authenticate with `POST /auth/login`, then click **Authorize** and paste the `accessToken`.
servers:
  - url: /api

tags:
  - name: System
    description: Operational endpoints.
  - name: Auth
    description: Registration and login.
  - name: Me
    description: The authenticated user's own account.

paths:
  /health:
    get:
      tags: [System]
      summary: Check that the API and its database are up
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [up] }
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  db: { type: string, enum: [down] }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`EMAIL_TAKEN`: the email is already registered'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_CREDENTIALS`: unknown email or wrong password (indistinguishable on purpose)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountDisabled' }

  /me:
    get:
      tags: [Me]
      summary: Get the authenticated user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token from `POST /auth/login`, valid for 1 hour.

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email, maxLength: 255, example: jan@example.com }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 characters and at most 72 bytes (bcrypt's input limit).
          example: Secret123!
        firstName: { type: string, minLength: 1, maxLength: 100, example: Jan }
        lastName: { type: string, minLength: 1, maxLength: 100, example: Kowalski }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: jan@example.com }
        password: { type: string, example: Secret123! }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Seconds until the token expires, example: 3600 }

    User:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer, example: 42 }
        email: { type: string, format: email, example: jan@example.com }
        firstName: { type: string, example: Jan }
        lastName: { type: string, example: Kowalski }
        role: { type: string, enum: [customer, admin] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Request validation failed }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: email }
                  location: { type: string, example: body }
                  message: { type: string, example: Must be a valid email }

  responses:
    ValidationError:
      description: '`VALIDATION_ERROR`: invalid or malformed request body'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`UNAUTHORIZED`, `INVALID_TOKEN` or `TOKEN_EXPIRED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountDisabled:
      description: '`ACCOUNT_DISABLED`: the account has been blocked'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
