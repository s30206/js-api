openapi: 3.0.3
info:
  title: PC Parts Store API
  version: 1.0.0
  description: |
    REST API for an online shop selling PC components.

    Authenticate with `POST /auth/login`, then click **Authorize** and paste the `accessToken`.
servers:
  - url: /api

tags:
  - name: System
    description: Operational endpoints.
  - name: Auth
    description: Registration and login.
  - name: Me
    description: The authenticated user's own account.
  - name: Users
    description: User administration (admin only).
  - name: Categories
    description: Product categories. Reading is public; creating, updating and deleting are admin only.
  - name: Brands
    description: Product brands. Reading is public; creating, updating and deleting are admin only.
  - name: Products
    description: Product catalog. Public; an admin token also unlocks inactive (delisted) products.
  - name: Cart
    description: The authenticated customer's persistent cart (customers only). Adding to the cart does not reserve stock.

paths:
  /health:
    get:
      tags: [System]
      summary: Check that the API and its database are up
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [up] }
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  db: { type: string, enum: [down] }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`EMAIL_TAKEN`: the email is already registered'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_CREDENTIALS`: unknown email or wrong password (indistinguishable on purpose)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountDisabled' }

  /me:
    get:
      tags: [Me]
      summary: Get the authenticated user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
    patch:
      tags: [Me]
      summary: Update the authenticated user's name
      description: Only the fields present in the body are changed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }

  /me/password:
    put:
      tags: [Me]
      summary: Change the authenticated user's password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password changed
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`UNAUTHORIZED`, `INVALID_TOKEN` or `TOKEN_EXPIRED`; `INVALID_CREDENTIALS` if `currentPassword` is wrong'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountDisabled' }

  /me/addresses:
    get:
      tags: [Me]
      summary: List the authenticated customer's addresses
      description: Oldest first. Not paginated, since a customer has at most 3 addresses.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }
    post:
      tags: [Me]
      summary: Add an address to the authenticated customer's address book
      description: A customer can have at most 3 addresses.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAddressRequest' }
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }
        '409':
          description: '`ADDRESS_LIMIT_REACHED`: the customer already has 3 addresses'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/addresses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Me]
      summary: Update one of the authenticated customer's addresses
      description: 'Only the fields present in the body are changed. Send `"label": null` to remove the label.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAddressRequest' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }
        '404': { $ref: '#/components/responses/AddressNotFound' }
    delete:
      tags: [Me]
      summary: Delete one of the authenticated customer's addresses
      description: Orders placed with this address keep their own copy of it.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Address deleted
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }
        '404': { $ref: '#/components/responses/AddressNotFound' }

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Ordered by id. Filters are optional and combine with AND.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
        - name: role
          in: query
          schema: { type: string, enum: [customer, admin] }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Users]
      summary: Get a user's details
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Users]
      summary: Block or unblock a user
      description: >
        A blocked user's tokens stop working immediately (`403 ACCOUNT_DISABLED`) and they can't log in.
        An admin can't block their own account.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserStatusRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409':
          description: '`CONFLICT`: an admin tried to block their own account'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      description: Ordered by id.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: One page of categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Categories]
      summary: Create a category
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '409':
          description: '`CATEGORY_EXISTS`: the name or slug is already taken'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Categories]
      summary: Get a category's details
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/CategoryNotFound' }
    patch:
      tags: [Categories]
      summary: Update a category
      description: Fields that are left out keep their value. `description` can be set to `null` to clear it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/CategoryNotFound' }
        '409':
          description: '`CATEGORY_EXISTS`: the name or slug is already taken'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Categories]
      summary: Delete a category
      description: Only a category that no product references can be deleted. Inactive products count as references.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Category deleted
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/CategoryNotFound' }
        '409':
          description: '`CATEGORY_IN_USE`: at least one product still references the category'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /brands:
    get:
      tags: [Brands]
      summary: List brands
      description: Ordered by id.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: One page of brands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Brands]
      summary: Create a brand
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBrandRequest' }
      responses:
        '201':
          description: Created brand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '409':
          description: '`BRAND_EXISTS`: the name is already taken'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /brands/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Brands]
      summary: Get a brand's details
      responses:
        '200':
          description: The brand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/BrandNotFound' }
    patch:
      tags: [Brands]
      summary: Update a brand
      description: Fields that are left out keep their value.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBrandRequest' }
      responses:
        '200':
          description: Updated brand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/BrandNotFound' }
        '409':
          description: '`BRAND_EXISTS`: the name is already taken'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Brands]
      summary: Delete a brand
      description: Only a brand that no product references can be deleted. Inactive products count as references.
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Brand deleted
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminOnly' }
        '404': { $ref: '#/components/responses/BrandNotFound' }
        '409':
          description: '`BRAND_IN_USE`: at least one product still references the brand'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products:
    get:
      tags: [Products]
      summary: List products
      description: >
        Filters are optional and combine with AND. Authentication is optional; send an admin token
        together with `includeInactive=true` to also list inactive products.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
        - name: categoryId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: brandId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: minPrice
          in: query
          description: Inclusive, at most 2 decimal places.
          schema: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$', example: '500' }
        - name: maxPrice
          in: query
          description: Inclusive, at most 2 decimal places.
          schema: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$', example: '1500.50' }
        - name: inStock
          in: query
          description: '`true`: only products with stock > 0; `false`: only products that are out of stock.'
          schema: { type: boolean }
        - name: specs
          in: query
          description: >
            Exact spec matches, written as `specs[<key>]=<value>`, e.g. `specs[socket]=AM5&specs[cores]=8`.
            Numeric-looking values are matched as numbers and `true`/`false` as booleans. At most 30 keys.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
            example: { socket: AM5 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [price, -price, name, -name, createdAt, -createdAt]
            default: -createdAt
        - name: includeInactive
          in: query
          description: Also list inactive products. Admin only; ignored for everyone else.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: One page of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Products]
      summary: Get a product's details
      description: Authentication is optional; inactive products are only returned to admins.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '404': { $ref: '#/components/responses/ProductNotFound' }

  /cart:
    get:
      tags: [Cart]
      summary: Get the authenticated customer's cart
      description: >
        Items are listed in the order they were added, with the product's current price. An item has
        `available: false` when its product was delisted or its stock dropped below the cart quantity.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The cart (empty `items` and a `total` of `0.00` when nothing was added)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }
    delete:
      tags: [Cart]
      summary: Remove everything from the authenticated customer's cart
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Cart cleared (also when it was already empty)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }

  /cart/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id of the product
        schema: { type: integer, minimum: 1 }
    put:
      tags: [Cart]
      summary: Add a product to the cart or set its quantity
      description: >
        Sets the quantity to exactly the given value (it does not add to the current one), creating the cart
        item when the product is not in the cart yet. Stock is checked here but not reserved; checkout
        checks it again.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCartItemRequest' }
      responses:
        '200':
          description: The updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }
        '404': { $ref: '#/components/responses/CartProductNotFound' }
        '409':
          description: '`INSUFFICIENT_STOCK`: the quantity is higher than the product''s current stock'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Cart]
      summary: Remove one product from the cart
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Product removed from the cart
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerOnly' }
        '404':
          description: '`NOT_FOUND`: the product is not in the authenticated customer''s cart'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token from `POST /auth/login`, valid for 1 hour.

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email, maxLength: 255, example: jan@example.com }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 characters and at most 72 bytes (bcrypt's input limit).
          example: Secret123!
        firstName: { type: string, minLength: 1, maxLength: 100, example: Jan }
        lastName: { type: string, minLength: 1, maxLength: 100, example: Kowalski }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: jan@example.com }
        password: { type: string, example: Secret123! }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Seconds until the token expires, example: 3600 }

    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100, example: Jan }
        lastName: { type: string, minLength: 1, maxLength: 100, example: Nowak }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, example: Secret123! }
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: 8-72 characters and at most 72 bytes (bcrypt's input limit).
          example: NewSecret456!

    User:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer, example: 42 }
        email: { type: string, format: email, example: jan@example.com }
        firstName: { type: string, example: Jan }
        lastName: { type: string, example: Kowalski }
        role: { type: string, enum: [customer, admin] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, description: Number of items matching the filters, example: 57 }
        totalPages: { type: integer, example: 3 }

    UpdateUserStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean, description: '`false` blocks the user, `true` unblocks them', example: false }

    CreateAddressRequest:
      type: object
      required: [recipientName, phone, street, city, postalCode]
      properties:
        label: { type: string, nullable: true, minLength: 1, maxLength: 50, example: Home }
        recipientName: { type: string, minLength: 1, maxLength: 200, example: Jan Kowalski }
        phone:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^\+?[0-9 ()-]+$'
          example: +48 600 123 456
        street: { type: string, minLength: 1, maxLength: 255, example: ul. Marszałkowska 1/2 }
        city: { type: string, minLength: 1, maxLength: 100, example: Warszawa }
        postalCode: { type: string, minLength: 1, maxLength: 20, example: 00-001 }
        country:
          type: string
          minLength: 2
          maxLength: 2
          default: PL
          description: ISO 3166-1 alpha-2 code, case-insensitive (stored upper-cased).
          example: PL

    UpdateAddressRequest:
      type: object
      properties:
        label: { type: string, nullable: true, minLength: 1, maxLength: 50, example: Office }
        recipientName: { type: string, minLength: 1, maxLength: 200, example: Jan Kowalski }
        phone: { type: string, minLength: 1, maxLength: 30, pattern: '^\+?[0-9 ()-]+$', example: +48 600 123 456 }
        street: { type: string, minLength: 1, maxLength: 255, example: ul. Prosta 20 }
        city: { type: string, minLength: 1, maxLength: 100, example: Kraków }
        postalCode: { type: string, minLength: 1, maxLength: 20, example: 30-001 }
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 code, case-insensitive (stored upper-cased).
          example: PL

    Address:
      type: object
      required: [id, label, recipientName, phone, street, city, postalCode, country, createdAt, updatedAt]
      properties:
        id: { type: integer, example: 7 }
        label: { type: string, nullable: true, example: Home }
        recipientName: { type: string, example: Jan Kowalski }
        phone: { type: string, example: +48 600 123 456 }
        street: { type: string, example: ul. Marszałkowska 1/2 }
        city: { type: string, example: Warszawa }
        postalCode: { type: string, example: 00-001 }
        country: { type: string, example: PL }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Category:
      type: object
      required: [id, name, slug, description, createdAt, updatedAt]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: CPU }
        slug: { type: string, example: cpu }
        description: { type: string, nullable: true, example: Desktop processors }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Cooler }
        slug: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: cooler }
        description: { type: string, nullable: true, maxLength: 5000, example: CPU coolers }

    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string, nullable: true, maxLength: 5000 }

    CategoryPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Brand:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: AMD }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateBrandRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Noctua }

    UpdateBrandRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    BrandPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Brand' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Product:
      type: object
      required:
        [id, sku, name, description, price, currency, stock, isActive, category, brand, specs, rating, createdAt, updatedAt]
      properties:
        id: { type: integer, example: 12 }
        sku: { type: string, example: CPU-AMD-R7-9800X3D }
        name: { type: string, example: AMD Ryzen 7 9800X3D }
        description: { type: string, nullable: true, example: 8-core desktop processor with 3D V-Cache }
        price: { type: string, description: Decimal string, so no precision is lost, example: '2199.00' }
        currency: { type: string, enum: [PLN] }
        stock: { type: integer, example: 14 }
        isActive: { type: boolean, description: '`false` means the product is delisted' }
        category:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: CPU }
            slug: { type: string, example: cpu }
        brand:
          type: object
          required: [id, name]
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: AMD }
        specs:
          type: object
          additionalProperties:
            oneOf: [{ type: string }, { type: number }, { type: boolean }]
          example: { socket: AM5, cores: 8, threads: 16, baseClockGhz: 4.7, boostClockGhz: 5.2, tdpW: 120 }
        rating:
          type: object
          required: [average, count]
          properties:
            average: { type: number, nullable: true, description: Rounded to 2 decimals; null without reviews, example: 4.67 }
            count: { type: integer, example: 3 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    SetCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99, example: 2 }

    CartItem:
      type: object
      required: [product, quantity, lineTotal, available]
      properties:
        product:
          type: object
          required: [id, name, price, stock, isActive]
          properties:
            id: { type: integer, example: 12 }
            name: { type: string, example: AMD Ryzen 7 9800X3D }
            price: { type: string, description: Current unit price as a decimal string, example: '2199.00' }
            stock: { type: integer, example: 14 }
            isActive: { type: boolean, description: '`false` means the product is delisted' }
        quantity: { type: integer, example: 1 }
        lineTotal: { type: string, description: '`price` times `quantity` as a decimal string', example: '2199.00' }
        available:
          type: boolean
          description: '`false` when the product is inactive or its stock is below `quantity`'

    Cart:
      type: object
      required: [items, total, currency]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total: { type: string, description: Sum of all line totals as a decimal string, example: '2199.00' }
        currency: { type: string, enum: [PLN] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Request validation failed }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: email }
                  location: { type: string, example: body }
                  message: { type: string, example: Must be a valid email }

  responses:
    ValidationError:
      description: '`VALIDATION_ERROR`: invalid or malformed request body'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '`UNAUTHORIZED`, `INVALID_TOKEN` or `TOKEN_EXPIRED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountDisabled:
      description: '`ACCOUNT_DISABLED`: the account has been blocked'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CustomerOnly:
      description: '`FORBIDDEN`: only customers can use this endpoint; `ACCOUNT_DISABLED`: the account has been blocked'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AddressNotFound:
      description: '`NOT_FOUND`: no address with this id belongs to the authenticated customer'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminOnly:
      description: '`FORBIDDEN`: only admins can use this endpoint; `ACCOUNT_DISABLED`: the account has been blocked'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UserNotFound:
      description: '`NOT_FOUND`: no user with this id'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProductNotFound:
      description: '`NOT_FOUND`: no product with this id, or it is inactive and the caller is not an admin'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CartProductNotFound:
      description: '`NOT_FOUND`: no active product with this id'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CategoryNotFound:
      description: '`NOT_FOUND`: no category with this id'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BrandNotFound:
      description: '`NOT_FOUND`: no brand with this id'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
